name: Scan NAPT support in esp32 core versions

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core_version: ["2.0.0", "2.0.3", "2.0.6", "2.0.9", "2.0.11", "2.0.14", "2.0.17", "3.0.0", "3.0.4", "3.1.0"]
    steps:
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Configure arduino-cli
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install esp32 core ${{ matrix.core_version }}
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core_version }}
        continue-on-error: true

      - name: Check NAPT symbol in lwip library
        run: |
          set -x
          CORE_DIR=~/.arduino15/packages/esp32/hardware/esp32/${{ matrix.core_version }}
          echo "Searching in: $CORE_DIR"

          NM=$(find ~/.arduino15/packages/esp32/tools -iname "*-nm" 2>/dev/null | head -n1)
          echo "nm tool: $NM"

          FOUND=0
          find "$CORE_DIR" -iname "*lwip*.a" 2>/dev/null | while read -r libfile; do
            FOUND=1
            echo "=== Checking file: $libfile ==="
            OUT=$("$NM" "$libfile" 2>/dev/null | grep -i "ip_napt_enable")
            echo "raw nm output: $OUT"

            if echo "$OUT" | grep -qE '^[0-9a-f]+ [TtWw] ip_napt_enable'; then
              echo ">>> RESULT: NAPT SUPPORTED in version ${{ matrix.core_version }} ($libfile) <<<"
            elif echo "$OUT" | grep -qE ' U ip_napt_enable'; then
              echo ">>> RESULT: NAPT NOT LINKED (undefined) in version ${{ matrix.core_version }} <<<"
            else
              echo ">>> RESULT: napt symbol not found at all in version ${{ matrix.core_version }} <<<"
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo ">>> RESULT: no lwip library file found for version ${{ matrix.core_version }} <<<"
          fi

      - name: Also list all lwip-related .a files (debug)
        if: always()
        run: |
          find ~/.arduino15/packages/esp32/hardware/esp32/${{ matrix.core_version }} -iname "*lwip*" 2>/dev/null || echo "nothing found"
