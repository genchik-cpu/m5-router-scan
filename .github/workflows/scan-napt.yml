name: Scan NAPT support in esp32 core versions

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core_version: ["2.0.0", "2.0.3", "2.0.6", "2.0.9", "2.0.11", "2.0.14", "2.0.17", "3.0.0", "3.0.4", "3.1.0"]
    steps:
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Configure arduino-cli
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install esp32 core ${{ matrix.core_version }}
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core_version }}
        continue-on-error: true

      - name: Check NAPT symbol in lwip library
        run: |
          set +e
          set -x

          NM=$(find ~/.arduino15/packages/esp32/tools -iname "*-nm" 2>/dev/null | head -n1)
          echo "nm tool: $NM"

          if [ -z "$NM" ]; then
            echo ">>> RESULT: toolchain nm not found for version ${{ matrix.core_version }} (core probably failed to install) <<<"
            exit 0
          fi

          echo "Searching for lwip .a files anywhere under packages/esp32 ..."
          LIBFILES=$(find ~/.arduino15/packages/esp32 -iname "*lwip*.a" 2>/dev/null)
          echo "Found candidate lwip files:"
          echo "$LIBFILES"

          if [ -z "$LIBFILES" ]; then
            echo "No file with 'lwip' in name, scanning ALL .a files for the symbol instead..."
            LIBFILES=$(find ~/.arduino15/packages/esp32 -iname "*.a" 2>/dev/null)
          fi

          FOUND_DEFINED=0
          FOUND_UNDEFINED=0
          FOUND_ANY_FILE=0

          while IFS= read -r libfile; do
            if [ -z "$libfile" ]; then
              continue
            fi
            FOUND_ANY_FILE=1

            OUT=$("$NM" "$libfile" 2>/dev/null | grep -i "ip_napt_enable")

            if [ -n "$OUT" ]; then
              echo "=== $libfile ==="
              echo "$OUT"

              echo "$OUT" | grep -qE '[0-9a-f]+ [TtWw] ip_napt_enable'
              if [ $? -eq 0 ]; then
                FOUND_DEFINED=1
                echo ">>> found DEFINED symbol in $libfile <<<"
              fi

              echo "$OUT" | grep -qE ' U ip_napt_enable'
              if [ $? -eq 0 ]; then
                FOUND_UNDEFINED=1
              fi
            fi
          done <<< "$LIBFILES"

          if [ "$FOUND_DEFINED" -eq 1 ]; then
            echo ">>> RESULT: NAPT SUPPORTED in version ${{ matrix.core_version }} <<<"
          elif [ "$FOUND_UNDEFINED" -eq 1 ]; then
            echo ">>> RESULT: NAPT symbol referenced but NOT implemented in version ${{ matrix.core_version }} <<<"
          elif [ "$FOUND_ANY_FILE" -eq 1 ]; then
            echo ">>> RESULT: napt symbol not found in any library for version ${{ matrix.core_version }} <<<"
          else
            echo ">>> RESULT: no library files found at all for version ${{ matrix.core_version }} (core install may have failed) <<<"
          fi

          exit 0
