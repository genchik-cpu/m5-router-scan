name: Build Merged Firmware (Core 3.0.0 + NAPT + WireGuard)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli and esptool
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH
          pip install esptool

      - name: Setup arduino-cli (Core 3.0.0)
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.0

      - name: Patch liblwip.a to enable NAPT in all flash-mode variants
        run: |
          set +e
          BASE=$(find ~/.arduino15/packages/esp32/tools/esp32-arduino-libs -maxdepth 1 -type d -iname "idf-release*" | head -n1)
          GOOD=$(find "$BASE/esp32/lib" -iname "liblwip.a" | head -n1)
          echo "Good liblwip.a (with NAPT): $GOOD"
          for variant in dio_qspi qio_qspi; do
            BAD=$(find "$BASE/esp32/$variant" -iname "liblwip.a" | head -n1)
            if [ -n "$BAD" ]; then
              echo "Patching $variant: $BAD"
              cp -f "$GOOD" "$BAD"
            fi
          done

      - name: Install M5 libraries
        run: |
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "M5GFX"
          arduino-cli lib install "M5StickCPlus2"

      - name: Install and restructure esp_wireguard as Arduino library
        run: |
          set -e
          mkdir -p ~/Arduino/libraries/WireGuardESP32Trombik/src
          cd /tmp
          wget -q -O wg.zip https://github.com/trombik/esp_wireguard/archive/refs/heads/main.zip
          unzip -q wg.zip
          SRC=esp_wireguard-main
          DEST=~/Arduino/libraries/WireGuardESP32Trombik

          cp "$SRC/include/esp_wireguard.h" "$DEST/src/"
          cp "$SRC/src/esp_wireguard.c" "$DEST/src/"
          cp "$SRC/src/wireguardif.c" "$DEST/src/"
          cp "$SRC/src/wireguardif.h" "$DEST/src/"
          cp "$SRC/src/wireguard-platform.c" "$DEST/src/"
          cp "$SRC/src/wireguard-platform.h" "$DEST/src/"
          cp "$SRC/src/wireguard.c" "$DEST/src/"
          cp "$SRC/src/wireguard.h" "$DEST/src/"
          cp "$SRC/src/crypto.c" "$DEST/src/"
          cp "$SRC/src/crypto.h" "$DEST/src/"

          mkdir -p "$DEST/src/crypto/refc"
          cp "$SRC/src/crypto/refc/"*.c "$DEST/src/crypto/refc/"
          cp "$SRC/src/crypto/refc/"*.h "$DEST/src/crypto/refc/"

          mkdir -p "$DEST/src/nacl/crypto_scalarmult/curve25519/ref"
          cp "$SRC/src/nacl/crypto_scalarmult/curve25519/ref/"* "$DEST/src/nacl/crypto_scalarmult/curve25519/ref/"

          # Создаём отдельный конфигурационный заголовок с нужными
          # значениями (обычно генерируются через Kconfig/menuconfig
          # в ESP-IDF, но в Arduino-сборке их нужно задать вручную).
          cat > "$DEST/src/wg_arduino_config.h" << 'EOF'
          #pragma once
          #define CONFIG_WIREGUARD_ESP_NETIF 1
          #define CONFIG_WIREGUARD_MAX_PEERS 1
          #define CONFIG_WIREGUARD_MAX_SRC_IPS 2
          #define CONFIG_MAX_INITIATIONS_PER_SECOND 2
          #define CONFIG_WIREGUARD_x25519_IMPLEMENTATION_DEFAULT 1
          EOF

          # Подключаем наш конфиг ТОЛЬКО в файлы самой библиотеки,
          # не трогая глобальные флаги компилятора (это и вызывало
          # поломку линковки String в основном скетче).
          for file in esp_wireguard.c wireguardif.c wireguardif.h wireguard-platform.c wireguard-platform.h; do
            sed -i '1i #include "wg_arduino_config.h"' "$DEST/src/$file"
          done

          cat > "$DEST/library.properties" << 'EOF'
          name=WireGuardESP32Trombik
          version=1.0.0
          author=trombik
          maintainer=trombik
          sentence=WireGuard client for ESP32 (ported from esp_wireguard)
          paragraph=Ported from https://github.com/trombik/esp_wireguard
          category=Communication
          url=https://github.com/trombik/esp_wireguard
          architectures=esp32
          EOF

          echo "=== Final library structure ==="
          find "$DEST" -type f
          echo "=== Verify config include was inserted ==="
          head -n 3 "$DEST/src/wireguardif.c"

      - name: Compile sketch
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=default_8MB,FlashFreq=80,FlashSize=8M,UploadSpeed=115200,PSRAM=enabled" \
            --output-dir build .

      - name: Create merged firmware
        run: |
          cd build
          python3 -m esptool --chip esp32 merge_bin -o m5-router-full.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x1000 m5-router-scan.ino.bootloader.bin \
            0x8000 m5-router-scan.ino.partitions.bin \
            0x10000 m5-router-scan.ino.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: m5-router-merged-firmware
          path: build/m5-router-full.bin
