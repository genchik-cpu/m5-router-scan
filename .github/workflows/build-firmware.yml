name: Build Merged Firmware (Single File)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install arduino-cli and esptool
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH
          pip install esptool
      
      - name: Setup arduino-cli
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      
      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "M5GFX"
          arduino-cli lib install "M5StickCPlus2"
          arduino-cli lib install "WireGuard-ESP32"
      
      - name: Compile sketch
        run: |
          mkdir -p build
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=default_8MB,FlashFreq=80,FlashSize=8M,UploadSpeed=115200,PSRAM=enabled" --output-dir build .
      
      - name: Create merged firmware (single file)
        run: |
          cd build
          # Объединяем bootloader (0x1000), partitions (0x8000) и app (0x10000) в один файл
          python3 -m esptool --chip esp32 merge_bin -o m5-router-full.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x1000 m5-router-scan.ino.bootloader.bin \
            0x8000 m5-router-scan.ino.partitions.bin \
            0x10000 m5-router-scan.ino.bin
      
      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: m5-router-merged-firmware
          path: |
            build/m5-router-full.bin
