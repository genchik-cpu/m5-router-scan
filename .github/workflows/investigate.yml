name: Investigate NAPT variant and WireGuard API

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Setup arduino-cli and install Core 3.0.0
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.0

      - name: Locate correct NM tool (specifically for plain esp32, not s2/s3)
        run: |
          set +e
          NM=$(find ~/.arduino15/packages/esp32/tools/xtensa-esp32-elf-gcc -iname "xtensa-esp32-elf-nm" 2>/dev/null | head -n1)
          echo "NM=$NM" >> $GITHUB_ENV
          echo "Using nm: $NM"
          "$NM" --version | head -n1

      - name: Find IDF release base folder
        run: |
          set +e
          BASE=$(find ~/.arduino15/packages/esp32/tools/esp32-arduino-libs -maxdepth 1 -type d -iname "idf-release*" | head -n1)
          echo "BASE=$BASE" >> $GITHUB_ENV
          echo "IDF base folder: $BASE"
          echo "=== Top-level contents of esp32/ subfolder ==="
          find "$BASE/esp32" -maxdepth 1 -type d 2>/dev/null

      - name: Check NAPT presence per variant folder
        run: |
          set +e
          for variant_dir in "$BASE"/esp32/*/; do
            [ -d "$variant_dir" ] || continue
            variant=$(basename "$variant_dir")
            echo ""
            echo "=== Variant: $variant ==="
            FOUND=0
            ANYFILE=0
            for lib in $(find "$variant_dir" -iname "*.a" 2>/dev/null); do
              ANYFILE=1
              OUT=$("$NM" "$lib" 2>/dev/null | grep -i "ip_napt_enable")
              if [ -n "$OUT" ]; then
                echo "  in $(basename "$lib"): $OUT"
                echo "$OUT" | grep -qE '[0-9a-f]+ [TtWw] ip_napt_enable'
                if [ $? -eq 0 ]; then
                  FOUND=1
                fi
              fi
            done
            if [ "$FOUND" -eq 1 ]; then
              echo "  >>> RESULT: variant '$variant' HAS working NAPT <<<"
            elif [ "$ANYFILE" -eq 1 ]; then
              echo "  >>> RESULT: variant '$variant' does NOT have NAPT <<<"
            else
              echo "  >>> RESULT: variant '$variant' has no .a files at all <<<"
            fi
          done
          exit 0

      - name: Show which lib path is used by default FQBN (dio, 80MHz, no PSRAM)
        run: |
          set +e
          echo "Checking includes flags file for default variant hint..."
          find "$BASE" -iname "*.txt" -path "*flags*" 2>/dev/null -exec echo {} \;
          echo "=== platform.txt relevant lines (if exists) ==="
          find ~/.arduino15/packages/esp32/hardware/esp32/3.0.0 -iname "platform.txt" -exec grep -n -i "qio\|dio\|psram\|variant" {} \; 2>/dev/null | head -n 50

      - name: Download esp_wireguard source
        run: |
          set +e
          mkdir -p /tmp/esp_wireguard
          cd /tmp/esp_wireguard
          wget -q -O repo.zip https://github.com/trombik/esp_wireguard/archive/refs/heads/master.zip
          unzip -q repo.zip
          echo "=== Repo structure ==="
          find . -maxdepth 3

      - name: Dump esp_wireguard.h header (FULL CONTENT)
        run: |
          set +e
          HEADER=$(find /tmp/esp_wireguard -iname "esp_wireguard.h" | head -n1)
          echo "Header path: $HEADER"
          echo "===================== FULL CONTENT START ====================="
          cat "$HEADER"
          echo "===================== FULL CONTENT END ====================="

      - name: Dump example / README
        run: |
          set +e
          find /tmp/esp_wireguard -iname "*.ino" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          find /tmp/esp_wireguard -path "*example*" -iname "*.c" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          find /tmp/esp_wireguard -iname "README*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null

      - name: Check Arduino compatibility metadata
        run: |
          set +e
          find /tmp/esp_wireguard -iname "library.properties" -exec cat {} \; 2>/dev/null
          find /tmp/esp_wireguard -iname "library.json" -exec cat {} \; 2>/dev/null
          find /tmp/esp_wireguard -iname "idf_component.yml" -exec cat {} \; 2>/dev/null

      - name: Check submodules and full source tree
        run: |
          rm -rf /tmp/esp_wireguard_full
          git clone --recurse-submodules --depth 1 https://github.com/trombik/esp_wireguard.git /tmp/esp_wireguard_full
          echo "=== FULL TREE ==="
          find /tmp/esp_wireguard_full -type f | sort
          echo "=== .gitmodules content (if exists) ==="
          cat /tmp/esp_wireguard_full/.gitmodules 2>/dev/null || echo "no .gitmodules file"
